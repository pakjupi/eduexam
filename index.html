    .icon-btn{background:none;border:0;color:var(--navy);font-size:30px;line-height:1;padding:8px 14px;border-radius:12px;min-height:auto}.icon-btn:hover{color:var(--blue)}

    await fbInit();
    const email=username.includes("@")?username.toLowerCase():`${username.toLowerCase()}@eduexam.local`;
    await FB.m.signOut(FB.auth).catch(()=>{});
    let cred;try{cred=await FB.m.signInWithEmailAndPassword(FB.auth,email,password)}catch(e){throw Error("Username atau password guru salah.")}
    let ok=false,why="";try{ok=(await FB.m.getDoc(fdoc("teachers",cred.user.uid))).exists();if(!ok)why="dokumen tidak ditemukan"}catch(e){why=String(e?.code||e?.message||e)}
    if(!ok){const id=cred.user.uid;await FB.m.signOut(FB.auth);console.warn("Login guru ditolak:",why,id);throw Error(/permission|insufficient/i.test(why)?`Akses ditolak oleh Firestore Rules (${why}). Pastikan rules sudah di-Publish dan berisi aturan koleksi teachers.`:`Akun ini belum terdaftar sebagai guru. Buat dokumen di koleksi teachers dengan Document ID persis: ${id}`)}
    await fbEnterTeacher(username.includes("@")?username.split("@")[0]:username)}

  /* ---------- Siswa ---------- */
  async function fbLoadStudent(idx){
    const cls=idx.className,sid=idx.studentId;
    const [ex,at,rm,pb]=await Promise.all([fq("exams","className",cls),fq("attempts","studentId",sid),fq("remedials","studentId",sid),fq("published","studentId",sid)]);
    const exams=ex.map(withId),bankIds=[...new Set(exams.map(e=>e.questionBankId).filter(Boolean))],bk=(await Promise.all(bankIds.map(id=>FB.m.getDoc(fdoc("questionBanks",id)).then(d=>d.exists()?{id:d.id,data:d.data()}:null).catch(()=>null)))).filter(Boolean);
    const qs=(await Promise.all(bankIds.map(b=>fq("questions","bankId",b)))).flat().map(withId);
    resetDb();
    db.students=[{id:sid,name:idx.name,nickname:idx.nickname||"",className:cls,attendance:Number(idx.attendance)||0,username:idx.username,nis:idx.nis||"",status:"Aktif"}];
    db.exams=exams;db.questionBanks=bk.map(withId);db.questions=qs;db.attempts=at.map(withId);db.remedials=rm.map(withId);
    db.results=pb.map(r=>({id:r.id,examId:r.data.examId,studentId:r.data.studentId,attemptId:r.data.attemptId,finalScore:r.data.finalScore,objectiveScore:r.data.objectiveScore,status:r.data.status,startedAt:r.data.startedAt,submittedAt:r.data.submittedAt,review:r.data.review||[],published:true}));
    FB.idx=idx}
  async function fbEnterStudent(idx){await fbLoadStudent(idx);role="student";user={name:idx.name,username:idx.username,role:"student"};activeAttempt=null;FB.fresh=true;go("student")}
  async function fbStudentLogin(username){
    await fbInit();await FB.m.signOut(FB.auth).catch(()=>{});
    let cred;try{cred=await FB.m.signInAnonymously(FB.auth)}catch(e){throw Error("Tidak dapat terhubung ke server. Periksa koneksi internet.")}
    let idx=null;try{const s=await FB.m.getDoc(fdoc("loginIndex",username));idx=s.exists()?s.data():null}catch(e){idx=null}
    if(!idx||idx.active!==true){await FB.m.signOut(FB.auth).catch(()=>{});throw Error("Username tidak ditemukan atau akun tidak aktif.")}
    try{await FB.m.setDoc(fdoc("claims",cred.user.uid),{username,studentId:idx.studentId,className:idx.className,createdAt:stamp()})}
    catch(e){await FB.m.signOut(FB.auth).catch(()=>{});throw Error("Gagal masuk. Hubungi guru untuk memeriksa akun Anda.")}
    await fbEnterStudent(idx)}
  let refreshing=false;
  async function fbRefreshStudent(){
    if(FB.fresh){FB.fresh=false;return}
    if(!FB.on||role!=="student"||!FB.idx||refreshing||(activeAttempt&&!activeAttempt.submittedAt))return;
    refreshing=true;
    try{await fbLoadStudent(FB.idx);if(page==="student")render()}
    catch(e){if(/permission|insufficient/i.test(String(e?.code||e?.message))){await fbSignOut();role=null;user=null;go("login");toast("Sesi berakhir. Silakan login kembali.","error")}else console.warn(e)}
    finally{refreshing=false}}
  function fbSaveAttemptSoon(a){if(!FB.on||role!=="student")return;clearTimeout(FB.attTimer);FB.attTimer=setTimeout(()=>fbSaveAttempt(a).catch(()=>{}),700)}
  function fbSaveAttempt(a){
    if(!FB.on||role!=="student")return Promise.resolve();
    clearTimeout(FB.attTimer);
    const run=()=>FB.m.setDoc(fdoc("attempts",a.id),clean(a)),p=FB.att.then(run,run);
    FB.att=p.catch(()=>{});return p}

  async function verifyTeacherPassword(pw){
    if(DEMO_MODE||!FB.on)return true;
    const m=await FB.m.getDoc(fdoc("settings","main")).catch(()=>null),email=m&&m.exists()?m.data().teacherEmail:"";
    if(!email)throw Error("Verifikasi belum tersedia. Minta guru login satu kali terlebih dahulu.");
    const app2=FB.m.initializeApp(FIREBASE_WEB_CONFIG,"verify"),a2=FB.m.getAuth(app2),f2=FB.m.getFirestore(app2);
    let cred;try{cred=await FB.m.signInWithEmailAndPassword(a2,email,pw)}catch(e){throw Error("Password guru salah.")}
    let ok=false;try{ok=(await FB.m.getDoc(FB.m.doc(f2,"teachers",cred.user.uid))).exists()}catch(e){}
    await FB.m.signOut(a2).catch(()=>{});
    if(!ok)throw Error("Password guru salah.");return true}
  /* ---------- Sesi ---------- */
  async function fbSignOut(){
    clearTimeout(FB.attTimer);
    if(role==="teacher"&&FB.pending){clearTimeout(FB.timer);await fbPush().catch(()=>{})}
    FB.unsub.forEach(f=>f());FB.unsub=[];FB.ready=false;FB.idx=null;FB.synced={};
    if(FB.on)await FB.m.signOut(FB.auth).catch(()=>{});
    resetDb()}
  async function firebaseLogin(form){
    if(DEMO_MODE)throw Error("Mode demo aktif: gunakan ikon guru atau siswa.");
    const username=String(form.username.value||"").trim(),pw=String(form.password?.value||"");
    if(!username)throw Error("Username wajib diisi.");
    if(pw)return fbTeacherLogin(username,pw);
    return fbStudentLogin(username.toUpperCase())}
  async function fbBoot(){
    setBadge("● Menghubungkan…","amber");
    try{await fbInit()}catch(e){console.error(e);setBadge("● Gagal terhubung","red");toast("Tidak dapat memuat Firebase. Periksa koneksi internet lalu muat ulang halaman.","error");return}
    try{
      await FB.auth.authStateReady();const u=FB.auth.currentUser;if(!u)return;
      if(u.isAnonymous){
        const c=await FB.m.getDoc(fdoc("claims",u.uid));if(!c.exists()){await FB.m.signOut(FB.auth);return}
        const i=await FB.m.getDoc(fdoc("loginIndex",c.data().username));if(!i.exists()||i.data().active!==true){await FB.m.signOut(FB.auth);return}
        await fbEnterStudent(i.data())
      }else{
        const t=await FB.m.getDoc(fdoc("teachers",u.uid));if(!t.exists()){await FB.m.signOut(FB.auth);return}
        await fbEnterTeacher(String(u.email||"guru").split("@")[0])}
    }catch(e){console.warn("Pemulihan sesi gagal",e)}}
  const renderBase=render;render=function(){renderBase();if(FB.on&&role==="teacher")fbSchedule()};
  const goBase=go;go=function(next){goBase(next);if(FB.on&&role==="student"&&next==="student")fbRefreshStudent()};
  window.addEventListener("beforeunload",ev=>{if(role==="teacher"&&(FB.pending||FB.busy)){ev.preventDefault();ev.returnValue=""}});

  if(DEMO_MODE){ensureDefaultSubject();genClasses(db.settings.defaultYear);render()}else{render();fbBoot()}
  </script>
